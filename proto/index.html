<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>거리 기반 자동 배정 시스템 — 라이브 프로토타입 (#157617)</title>
  <meta name="description" content="거리 기반 자동 배정 시스템 클릭 가능한 관리자 콘솔 프로토타입" />

  <!-- Pretendard (한글 최적화) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CDN (JIT) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Pretendard Variable"', 'Pretendard', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'SF Mono', 'monospace'],
          },
        },
      },
    };
  </script>

  <!-- React 18 + Babel (proto 트랙 전용) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html, body {
      font-family: 'Pretendard Variable', Pretendard, system-ui, sans-serif;
      background: #020617;
      color: #f1f5f9;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .font-mono, code, .tabular { font-family: 'JetBrains Mono', monospace; }

    /* Aurora opacity 0.10 이하 (proto 가독성) */
    .aurora-bg {
      position: fixed; inset: 0; z-index: -10; background: #020617;
    }
    .aurora-bg::before {
      content: ''; position: absolute; inset: 0; opacity: 0.08;
      background:
        radial-gradient(at 15% 25%, rgba(139,92,246,0.4), transparent 50%),
        radial-gradient(at 85% 75%, rgba(16,185,129,0.3), transparent 50%);
    }

    /* 화면 전환 fade-in */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .scr { animation: fadeUp 0.32s ease-out; }

    /* 모바일 가드 */
    .mobile-guard { display: none; }
    @media (max-width: 1023px) {
      .mobile-guard {
        display: flex; position: fixed; inset: 0; z-index: 100;
        background: rgba(2,6,23,0.95); backdrop-filter: blur(20px);
        align-items: center; justify-content: center; padding: 2rem; text-align: center;
      }
      .app-root { filter: blur(4px); pointer-events: none; }
    }
  </style>
</head>

<body>
  <div class="aurora-bg" aria-hidden="true"></div>

  <!-- 데이터 + 컴포넌트 + 4화면 (순서 중요) -->
  <script src="./data.js"></script>
  <script type="text/babel" src="./components.jsx"></script>
  <script type="text/babel" src="./tweaks-panel.jsx"></script>
  <script type="text/babel" src="./dashboard.jsx"></script>
  <script type="text/babel" src="./console.jsx"></script>
  <script type="text/babel" src="./history.jsx"></script>
  <script type="text/babel" src="./templates.jsx"></script>

  <!-- App shell -->
  <div id="app-root" class="app-root"></div>

  <!-- 모바일 가드 오버레이 -->
  <div class="mobile-guard">
    <div class="rounded-2xl bg-slate-900 border border-slate-700 p-8 max-w-sm">
      <div class="text-xs font-mono text-purple-400 mb-3">1024px+</div>
      <h2 class="text-lg font-bold mb-2">데스크탑에서 열어주세요</h2>
      <p class="text-sm text-slate-400">
        본 프로토타입은 1024px 이상 해상도에서 최적화되어 있습니다.<br>
        텍스트만 보시려면 <a href="../refui/" class="text-purple-400 underline">레퍼런스 UI</a>를 이용해주세요.
      </p>
    </div>
  </div>

  <!-- 데모 데이터 가드 배지 (필수 — 우하단) -->
  <div class="fixed bottom-3 right-3 z-50 flex items-center gap-2 px-3 py-1.5 rounded-full bg-amber-950 border border-amber-500/40 text-[10px] text-amber-300 font-medium">
    <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
    데모 데이터 · 실데이터 미연결
  </div>

  <!-- App mount -->
  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [route, setRoute] = useState({ name: 'dashboard' });
      const [tweaks, setTweaks] = useState(window.TWEAK_DEFAULTS);
      const setTweak = (key, val) => setTweaks(prev => ({ ...prev, [key]: val }));

      // demo iframe 호환성 — 외부에서 화면 전환 가능하게 노출 (필수 — demo 트랙 의존)
      // demo/자동시연.html의 navIframe()가 iframe.contentWindow.__navigate(name)를 호출
      React.useEffect(() => {
        window.__navigate = (name) => setRoute({ name, payload: null });
        return () => { delete window.__navigate; };
      }, []);

      const screens = {
        dashboard: window.Dashboard,
        console:   window.Console,
        history:   window.History,
        settings:  window.Templates,
      };
      const Screen = screens[route.name] || window.Dashboard;

      const screenLabel = {
        dashboard: '01 배정 현황 모니터',
        console:   '02 실패 건 처리·수동 재배정',
        history:   '03 배정 이력·통계',
        settings:  '04 규칙 파라미터·시뮬레이션',
      }[route.name];

      return (
        <div className="min-h-screen flex" style={{ '--brand': tweaks.brandColor }}>
          {/* Sidebar */}
          <aside className="w-60 bg-slate-950 border-r border-slate-800 p-4 flex flex-col">
            <div className="flex items-center gap-2 mb-8">
              <div className="w-8 h-8 rounded-lg" style={{ background: tweaks.brandColor }}></div>
              <div>
                <div className="font-bold text-sm">{tweaks.brandName}</div>
                <div className="text-[10px] text-slate-500 font-mono">#157617</div>
              </div>
            </div>
            <nav className="flex-1 space-y-1">
              {[
                ['dashboard', '배정 모니터',   'home'],
                ['console',   '처리 콘솔',     'send'],
                ['history',   '이력 · 통계',   'history'],
                ['settings',  '파라미터',      'settings'],
              ].map(([key, label, icon]) => (
                <button key={key} onClick={() => setRoute({ name: key })}
                  className={`w-full flex items-center gap-2 px-3 py-2 rounded text-sm transition ${
                    route.name === key
                      ? 'bg-slate-800 text-white'
                      : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200'
                  }`}>
                  <window.Icon name={icon} className="w-4 h-4" />
                  {label}
                </button>
              ))}
            </nav>
            <div className="pt-4 border-t border-slate-800 text-[10px] text-slate-600 leading-relaxed">
              추가 도입 검토 항목 2~5 형상<br />
              계약 범위 밖 · 별도 견적 (제안서 §2.5)
            </div>
          </aside>

          {/* Main */}
          <main className="flex-1 overflow-auto" data-screen-label={screenLabel}>
            <div className="scr p-8" key={route.name}>
              <Screen route={route} navigate={(name, payload) => setRoute({ name, payload })} tweaks={tweaks} setTweak={setTweak} />
            </div>
          </main>

          {/* Tweaks Panel — 검토자용 정책·브랜드 토글 */}
          <window.TweaksPanel title="Tweaks — 시연 조정">
            <window.TweakSection label="브랜드" />
            <window.TweakText label="콘솔 명칭" value={tweaks.brandName}
              onChange={(v) => setTweak('brandName', v)} />
            <window.TweakColor label="브랜드 색" value={tweaks.brandColor}
              onChange={(v) => setTweak('brandColor', v)} />

            <window.TweakSection label="배정 정책 (후보 정렬·추천이 실제로 바뀝니다)" />
            <window.TweakRadio label="정책 모드" value={tweaks.policyMode}
              options={[
                { value: 'DISTANCE_FIRST', label: '거리 우선' },
                { value: 'BALANCE_FIRST',  label: '균등 우선' },
              ]}
              onChange={(v) => setTweak('policyMode', v)} />
            <window.TweakToggle label="근거 배지 표시" value={tweaks.showRuleBadges}
              onChange={(v) => setTweak('showRuleBadges', v)} />
          </window.TweaksPanel>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
  </script>

  <!-- Tweaks 열기 버튼 (호스트 없이 단독 실행 시에도 패널 접근 가능) -->
  <button
    onclick="window.postMessage({ type: '__activate_edit_mode' }, '*')"
    class="fixed bottom-10 right-3 z-40 px-3 py-1.5 rounded-full bg-slate-900 border border-slate-700/60 text-[10px] text-slate-300 hover:text-white hover:border-purple-500/50 transition"
    title="정책 모드·브랜드 색 조정 패널 열기">
    Tweaks 열기
  </button>
</body>
</html>
